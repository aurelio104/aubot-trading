# Copiar a repo aubot-trading en la raíz tras crear el repo en GitHub
name: aubot-api
type: web

build:
  docker:
    dockerfile: Dockerfile

ports:
  - port: 8080
    protocol: http

routes:
  - path: /
    port: 8080

health_checks:
  - http:
      path: /health
      port: 8080
      interval: 30s
      timeout: 10s

env:
  - name: AUBOT_AUTO_START
    value: "true"
  - name: AUBOT_AUTO_TRADE
    value: "false"
  - name: AUBOT_TICK_MS
    value: "1000"
  - name: BINANCE_TESTNET
    value: "false"
  - name: AUBOT_CAPITAL_MODE
    value: "true"
  - name: AUBOT_CAPITAL_PCT
    value: "80"
  - name: AUBOT_TAKE_PROFIT_PCT
    value: "3"
  - name: AUBOT_STOP_LOSS_PCT
    value: "1.5"
  - name: AUBOT_MIN_RR_RATIO
    value: "2"
  - name: AUBOT_MAX_RISK_PCT
    value: "2"
  - name: AUBOT_MAX_DAILY_LOSS_PCT
    value: "3"
  - name: AUBOT_MAX_WEEKLY_LOSS_PCT
    value: "8"
  - name: AUBOT_AUTO_OFF_WEEKLY_LOSS_PCT
    value: "5"
  - name: AUBOT_MAX_TRADES_PER_DAY
    value: "1"
  - name: AUBOT_HIGH_CONF_UNLIMITED_TRADES
    value: "true"
  - name: AUBOT_HIGH_CONF_MIN_SCORE
    value: "85"
  - name: AUBOT_MAX_TRADES_HIGH_CONF
    value: "0"
  - name: AUBOT_SMALL_CAPITAL_MAX_TRADES
    value: "1"
  - name: AUBOT_SMALL_CAPITAL_PCT_MAX
    value: "80"
  - name: AUBOT_MED_CAPITAL_PCT_MAX
    value: "80"
  - name: AUBOT_SIZING_PRIORITIZE_PCT
    value: "true"
  - name: AUBOT_RESERVE_USDT
    value: "3"
  - name: AUBOT_FG_BLOCK_BELOW
    value: "25"
  - name: AUBOT_EXTREME_FEAR_MIN_SCORE
    value: "90"
  - name: AUBOT_MEAN_REVERSION_RSI_MIN
    value: "20"
  - name: AUBOT_MEAN_REVERSION_RSI_MAX
    value: "35"
  - name: AUBOT_ENTRY_VOLUME_MULT
    value: "1"
  - name: AUBOT_ENTRY_CONFIRMATION
    value: "true"
  - name: AUBOT_BLOCK_ENTRY_BEAR
    value: "true"
  - name: AUBOT_LONG_REGIME_GATE
    value: "true"
  - name: AUBOT_BTC_REFERENCE
    value: "true"
  - name: AUBOT_UNIFIED_BTC_GATES
    value: "true"
  - name: AUBOT_CANDIDATE_SYMBOLS
    value: "ADAUSDT;DOGEUSDT;SOLUSDT;LINKUSDT;AVAXUSDT"
  - name: AUBOT_AUTO_EXPAND_SYMBOLS
    value: "true"
  - name: AUBOT_TIER_MID_USDT
    value: "35"
  - name: AUBOT_TIER_LARGE_USDT
    value: "120"
  - name: AUBOT_TIER_BTC_USDT
    value: "400"
  - name: AUBOT_TIER_FULL_USDT
    value: "800"
  - name: AUBOT_BTC_MIN_QUOTE_USDT
    value: "50"
  - name: AUBOT_DECISION_GATE
    value: "true"
  - name: AUBOT_PRE_ENTRY_LOSS_STREAK
    value: "2"
  - name: AUBOT_LOSS_STREAK_PAUSE_H2
    value: "1"
  - name: AUBOT_LOSS_STREAK_PAUSE_H3
    value: "2"
  - name: AUBOT_MAX_SL_DAY
    value: "3"
  - name: AUBOT_CIRCUIT_BREAK_HOURS
    value: "72"
  - name: AUBOT_MIN_NET_EDGE_FEE_MULT
    value: "3"
  - name: AUBOT_PAPER_TRADE
    value: "false"
  - name: AUBOT_PSYCHOLOGY_GUARD
    value: "true"
  - name: AUBOT_PAIR_WR_GATE
    value: "true"
  - name: AUBOT_MIN_PAIR_WR
    value: "40"
  - name: AUBOT_FEE_FIRST_AUTO
    value: "true"
  - name: AUBOT_AUTO_APPLY_LEARNING
    value: "true"
  - name: AUBOT_PAIR_WR_NIGHTLY
    value: "true"
  - name: AUBOT_PAIR_WR_UPDATE_HOUR
    value: "3"
  - name: AUBOT_PAIR_WR_UNKNOWN_ALLOW
    value: "true"
  - name: AUBOT_LEDGER_DIR
    value: "/data/ledger"
  - name: AUBOT_JOURNAL_DIR
    value: "/data/journal"
  # Secrets en panel: BINANCE_API_KEY, BINANCE_API_SECRET
